<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CR-10 Wi-Fi Setup</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d2330;--mut:#6b7280;--line:#e3e6eb;--acc:#2563eb;--bad:#b91c1c;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c24;--fg:#e6e9ef;--mut:#9aa3b2;--line:#2a303c;--acc:#60a5fa;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px 16px}
.card{max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
h1{font-size:19px;margin:0 0 4px}p{color:var(--mut);margin:0 0 16px;font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{font:inherit;font-weight:600;width:100%;margin-top:18px;padding:11px;border-radius:8px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.ghost{background:transparent;color:var(--bad);border:1px solid var(--line);margin-top:10px}
#msg{margin-top:14px;font-size:14px;min-height:1.4em}
a{color:var(--acc)}
.show{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--mut)}
.show input{width:auto}
</style>
</head>
<body>
<div class="card">
  <h1>Wi-Fi setup</h1>
  <p>Join the print server to your network. After saving, it reboots and is reachable at <b>http://cr10.local/</b> (or the IP your router assigns).</p>
  <form id="f">
    <label for="ssid">Network name (SSID)</label>
    <input id="ssid" name="ssid" maxlength="32" required autocomplete="off" autocapitalize="none">
    <label for="pass">Password</label>
    <input id="pass" name="pass" type="password" maxlength="63" autocomplete="off">
    <div class="show"><input type="checkbox" id="sh"><span>Show password</span></div>
    <button>Save &amp; reboot</button>
  </form>
  <button class="ghost" id="forget">Forget network (back to setup AP)</button>
  <div id="msg"></div>
  <p style="margin-top:16px"><a href="/">← Back to the print server</a></p>
</div>
<script>
const m=document.getElementById('msg');
document.getElementById('sh').onchange=e=>document.getElementById('pass').type=e.target.checked?'text':'password';
async function save(body){
  try{
    const r=await fetch('/api/wifi',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    const j=await r.json();
    m.textContent=j.ok?'Saved. Rebooting… reconnect your phone/PC to your normal Wi-Fi, then open http://cr10.local/':'Error: '+j.error;
  }catch(e){m.textContent='Saved. The device is rebooting.'}
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();save(new URLSearchParams(new FormData(e.target)).toString())};
document.getElementById('forget').onclick=()=>{if(confirm('Forget the stored network?'))save('ssid=')};
</script>
</body>
</html>
